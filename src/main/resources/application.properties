spring.application.name=Capstone_3

spring.datasource.url=jdbc:mysql://localhost:3306/capstone_3


spring.datasource.username=root
# Load local overrides (password, API keys). File is gitignored — copy from application-local.properties.example
spring.config.import=optional:classpath:application-local.properties
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

spring.jpa.show-sql=true

spring.jpa.generate-ddl=true

spring.jpa.hibernate.ddl-auto=create-drop

Spring.web.error.include-message=always

Spring.web.error.include-stacktrace=always

