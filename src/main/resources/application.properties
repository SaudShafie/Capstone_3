spring.application.name=Capstone_3

# Load local overrides (password, API keys). File is gitignored — copy from application-local.properties.example
spring.config.import=optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://localhost:3308/capstone_3
spring.datasource.username=root

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
# update = apply schema changes without drop warnings; use create-drop in application-local.properties only when you need a full reset
spring.jpa.hibernate.ddl-auto=update

spring.web.error.include-message=always
spring.web.error.include-stacktrace=always
